# electron-builder.yml

# The unique application ID
appId: com.v4amaral.copiloto

# The user-facing application name
productName: Copiloto V4

# Publish configuration for GitHub releases
publish:
    provider: github
    owner: v4amaraltech
    repo: copiloto-reunioes
    releaseType: draft

# Protocols configuration for deep linking
protocols:
    name: PickleGlass Protocol
    schemes: 
        - pickleglass

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - pickleglass_web/backend_node/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: pickleglass_web/out
      to: out

asarUnpack:
    - "src/ui/assets/SystemAudioDump"
    - "**/node_modules/sharp/**/*"
    - "**/node_modules/@img/**/*"

# Windows configuration
win:
    icon: src/ui/assets/logo.ico
    target:
        - target: nsis
          arch: x64
        - target: portable
          arch: x64
    requestedExecutionLevel: asInvoker
    signAndEditExecutable: true
    cscLink: build\certs\glass-dev.pfx
    cscKeyPassword: "${env.CSC_KEY_PASSWORD}"
    signtoolOptions:
      certificateSubjectName: "Glass Dev Code Signing"

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: Glass

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.utilities
    # Path to the .icns icon file
    icon: src/ui/assets/logo.icns
    # Minimum macOS version (supports both Intel and Apple Silicon)
    minimumSystemVersion: '11.0'
    hardenedRuntime: true
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    # Assinatura: `identity: null` desliga a assinatura do electron-builder e o
    # hook afterPack (scripts/adhoc-sign.js) assina ad-hoc. Com Developer ID,
    # use `npm run build:signed` — ele sobrepõe a identity pela variável CSC_NAME
    # e, com as APPLE_* definidas, scripts/notarize.js notariza.
    # Passo a passo: docs/ASSINATURA-E-NOTARIZACAO.md
    identity: null
    target:
      - target: dmg
        arch: universal
      - target: zip
        arch: universal

# Hook pós-empacotamento: assinatura ad-hoc com identificador com.v4amaral.copiloto
afterPack: scripts/adhoc-sign.js
# Notarização na Apple (só roda com as variáveis APPLE_* definidas)
afterSign: scripts/notarize.js

# DMG com a identidade V4: ícone do volume e título
dmg:
    icon: src/ui/assets/logo.icns
    title: 'Copiloto V4'
    # Nome fixo para o link /releases/latest/download/ nunca quebrar
    artifactName: 'CopilotoV4-latest.${ext}'
