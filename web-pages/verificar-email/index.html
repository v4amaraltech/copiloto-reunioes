<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Confirmar e-mail · Copiloto V4</title>
<style>
  :root {
    --fundo: #0d0d0f;
    --cartao: #16161a;
    --borda: #26262c;
    --texto: #f2f2f4;
    --texto-fraco: #9a9aa4;
    --acento: #c8102e;
    --acento-claro: #e4364f;
    --erro: #ff6b7d;
    --ok: #3ddc91;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--fundo);
    color: var(--texto);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .cartao {
    width: 100%;
    max-width: 400px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
  }
  .marca {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 26px;
  }
  .marca .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--acento); flex: none; }
  .marca span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-fraco); }
  h1 { font-size: 21px; margin: 0 0 8px; font-weight: 600; letter-spacing: -.01em; }
  p.sub { margin: 0 0 4px; color: var(--texto-fraco); font-size: 14px; }
  .selo {
    width: 52px; height: 52px; border-radius: 50%;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; line-height: 1;
  }
  .selo.ok  { background: rgba(61,220,145,.12);  border: 1px solid rgba(61,220,145,.35); color: var(--ok); }
  .selo.mal { background: rgba(255,107,125,.1);  border: 1px solid rgba(255,107,125,.3); color: var(--erro); }
  .selo.espera { background: #1c1c21; border: 1px solid var(--borda); color: var(--texto-fraco); }
  .escondido { display: none !important; }
  a.botao-link {
    display: block; text-decoration: none;
    background: var(--acento); color: #fff; border-radius: 9px;
    padding: 13px; font-weight: 600; font-size: 15px; margin-top: 22px;
  }
  a.botao-link:hover { background: var(--acento-claro); }
  .rodape { margin-top: 20px; font-size: 12.5px; color: var(--texto-fraco); line-height: 1.5; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .girando { animation: girar 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .girando { animation: none; } }
</style>
</head>
<body>
<main class="cartao">
  <div class="marca"><div class="ponto"></div><span>Copiloto V4</span></div>

  <!-- Estado 1: confirmando -->
  <section id="tela-espera">
    <div class="selo espera girando">◠</div>
    <h1>Confirmando seu e-mail…</h1>
    <p class="sub">Só um instante.</p>
  </section>

  <!-- Estado 2: confirmado -->
  <section id="tela-ok" class="escondido">
    <div class="selo ok">✓</div>
    <h1>E-mail confirmado</h1>
    <p class="sub">Pode voltar ao Copiloto.</p>
    <a class="botao-link" href="pickleglass://verify-done">Abrir o Copiloto</a>
    <p class="rodape">Se o app não abrir sozinho, é só abrir o Copiloto V4 normalmente pelo seu computador.</p>
  </section>

  <!-- Estado 3: falhou -->
  <section id="tela-erro" class="escondido">
    <div class="selo mal">!</div>
    <h1 id="erro-titulo">Não foi possível confirmar</h1>
    <p class="sub" id="erro-texto"></p>
    <p class="rodape">Abra o Copiloto e peça um novo e-mail de confirmação.</p>
  </section>
</main>

<script>
  // ── Configuração — trocar aqui se o servidor mudar ──────────────────
  var APPWRITE_ENDPOINT = 'https://appwrite.v4companyamaral.com/v1';
  var APPWRITE_PROJECT_ID = '6a94c150000c9aabb8c5';
  // ────────────────────────────────────────────────────────────────────

  var params = new URLSearchParams(location.search);
  var userId = params.get('userId');
  var secret = params.get('secret');

  function mostrarErro(titulo, texto) {
    document.getElementById('tela-espera').classList.add('escondido');
    document.getElementById('tela-ok').classList.add('escondido');
    document.getElementById('erro-titulo').textContent = titulo;
    document.getElementById('erro-texto').textContent = texto;
    document.getElementById('tela-erro').classList.remove('escondido');
  }

  function traduzir(json, status) {
    var tipo = (json && json.type) || '';
    if (tipo === 'user_invalid_token') {
      return 'Este link expirou ou já foi usado.';
    }
    if (tipo === 'user_not_found') {
      return 'Não encontramos esta conta.';
    }
    if (tipo === 'general_rate_limit_exceeded' || status === 429) {
      return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
    }
    return 'Tente novamente em instantes.';
  }

  if (!userId || !secret) {
    mostrarErro('Link inválido', 'Este endereço não tem os dados de confirmação.');
  } else {
    // Rota SINGULAR: o servidor roda Appwrite 1.7.4, onde a rota é
    // /account/verification (o /account/verifications, plural, só existe no 1.9.x).
    fetch(APPWRITE_ENDPOINT + '/account/verification', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Appwrite-Project': APPWRITE_PROJECT_ID,
        'X-Appwrite-Response-Format': '1.7.0'
      },
      body: JSON.stringify({ userId: userId, secret: secret })
    })
      .then(function (resposta) {
        return resposta.json().catch(function () { return {}; }).then(function (json) {
          return { ok: resposta.ok, status: resposta.status, json: json };
        });
      })
      .then(function (r) {
        if (!r.ok) {
          mostrarErro('Não foi possível confirmar', traduzir(r.json, r.status));
          return;
        }
        document.getElementById('tela-espera').classList.add('escondido');
        document.getElementById('tela-ok').classList.remove('escondido');
      })
      .catch(function () {
        mostrarErro('Sem conexão', 'Verifique a internet e abra o link de novo.');
      });
  }
</script>
</body>
</html>
